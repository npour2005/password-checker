name: Build APK

on:
  push:
  workflow_dispatch:

env:
  UV_PYTHON: 3.12
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK (try 1)
        id: try1
        continue-on-error: true
        run: uv run flet build apk --yes --verbose

      - name: Accept Android licenses
        if: steps.try1.outcome == 'failure'
        run: yes | ~/flutter/*/bin/flutter doctor --android-licenses || true

      - name: Build APK (try 2)
        if: steps.try1.outcome == 'failure'
        run: uv run flet build apk --yes --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/apk
